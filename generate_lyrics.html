<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成歌词 JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid #ccc;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>生成歌词 JSON 文件</h1>
    <textarea id="lyrics-input" placeholder="粘贴歌词文本，每行一行歌词，第一行为歌曲名称"></textarea>
    <button onclick="generateJSON()">生成 JSON</button>

    <div id="json-preview" class="hidden">
        <h2>预览 JSON</h2>
        <table id="lyrics-table">
            <thead>
                <tr>
                    <th>时间 (秒)</th>
                    <th>歌词</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button onclick="saveJSON()">保存 JSON 文件</button>
    </div>

    <script>
        function generateJSON() {
            const input = document.getElementById('lyrics-input').value;
            const lines = input.split('\n').filter(line => line.trim() !== '');

            if (lines.length === 0) {
                alert('请输入歌词文本！');
                return;
            }

            const songName = lines.shift().trim();
            const lyrics = lines.map((line, index) => {
                const duration = Math.max(2, Math.ceil(line.length / 5)); // 每 5 个字符 1 秒，最少 2 秒
                return { time: index * duration, text: line.trim() };
            });

            const tableBody = document.querySelector('#lyrics-table tbody');
            tableBody.innerHTML = '';

            lyrics.forEach(lyric => {
                const row = document.createElement('tr');
                const timeCell = document.createElement('td');
                const textCell = document.createElement('td');

                timeCell.textContent = lyric.time;
                textCell.textContent = lyric.text;

                row.appendChild(timeCell);
                row.appendChild(textCell);
                tableBody.appendChild(row);
            });

            document.getElementById('json-preview').classList.remove('hidden');

            // 保存 JSON 数据到全局变量
            window.generatedJSON = { songName, lyrics };
        }

        function saveJSON() {
            if (!window.generatedJSON) {
                alert('请先生成 JSON！');
                return;
            }

            const json = JSON.stringify(window.generatedJSON, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `${window.generatedJSON.songName}.json`;
            a.click();

            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
